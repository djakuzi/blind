name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare example configuration
        run: |
          cp .env.template .env.prod
          sed 's/^APP_MODE=prod$/APP_MODE=debug/' .env.template > .env.debug

      - name: Verify client
        run: npm run cli -- verify all
