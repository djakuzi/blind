name: Cleanup performance staging

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-performance]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove staging branch
        shell: bash
        run: git push origin --delete automation/optimized-game-images
