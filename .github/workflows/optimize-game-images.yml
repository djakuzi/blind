name: Optimize game mode images

on:
  push:
    branches:
      - development

jobs:
  optimize:
    if: contains(github.event.head_commit.message, '[optimize-game-images]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert game mode images
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          image_dir = Path('public/game/images/gameMode')

          for source in sorted(image_dir.glob('*.png')):
              target = source.with_suffix('.webp')

              with Image.open(source) as image:
                  image.save(target, 'WEBP', quality=86, method=6)
                  print(f'{source.name}: {image.width}x{image.height} -> {target.name}')

          data_path = Path('public/game/gameModes.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))

          for mode in data:
              for theme, source in mode.get('img', {}).items():
                  if source.endswith('.png'):
                      mode['img'][theme] = source[:-4] + '.webp'

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Push optimized image branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/optimized-game-images
          git add public/game/gameModes.json public/game/images/gameMode/*.webp
          git commit -m "chore: stage optimized game images"
          git push --force origin automation/optimized-game-images
