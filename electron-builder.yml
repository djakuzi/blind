appId: com.djakuzi.blind
productName: Blind

asar: true

directories:
  output: release/desktop

files:
  - dist/**/*
  - dist-electron/**/*

mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - universal
  artifactName: "${productName}-${version}-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Game
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
