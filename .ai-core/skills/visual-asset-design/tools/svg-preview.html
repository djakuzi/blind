<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG Preview</title>
<!--
  Стенд визуальной проверки SVG для Blind.
  Открывать через dev-сервер проекта (npm run dev):
    http://localhost:5173/.ai-core/skills/visual-asset-design/tools/svg-preview.html?src=/src/assets/icons/back/back-arrow-dark.svg,/src/assets/icons/back/back-arrow-light.svg
  Параметры:
    src  — один или несколько путей к SVG через запятую (обязательно)
    ref  — путь к эталонному изображению (макету) для наложения (необязательно)
    bg   — auto | dark | light | both (по умолчанию auto: *-dark.svg на тёмном, *-light.svg на светлом)
-->
<style>
  :root { --dark: #111114; --light: #f7f7f8; --guide: #ff2d6f; --ink: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 13px/1.4 system-ui, sans-serif; background: #2a2a2e; color: #ddd; }
  h2 { font-size: 14px; margin: 24px 0 8px; word-break: break-all; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tile { position: relative; display: grid; place-items: center; padding: 8px; border-radius: 6px; }
  .tile--dark { background: var(--dark); }
  .tile--light { background: var(--light); }
  .tile svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .frame { position: relative; }
  .frame--guides::before, .frame--guides::after { content: ""; position: absolute; background: var(--guide); opacity: .6; pointer-events: none; }
  .frame--guides::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .frame--guides::after { top: 50%; left: 0; right: 0; height: 1px; }
  .vb { position: absolute; inset: 0; outline: 1px dashed rgba(127,127,127,.6); pointer-events: none; }
  .bbox { position: absolute; outline: 1px solid var(--guide); pointer-events: none; }
  .ref { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .no-guides .frame--guides::before, .no-guides .frame--guides::after, .no-guides .bbox, .no-guides .vb { display: none; }
  .label { color: var(--ink); font-size: 11px; }
  .stats { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; background: #1c1c1f; padding: 8px 10px; border-radius: 6px; }
  .warn { color: #ffb020; }
  .controls { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="controls">
  <label><input type="checkbox" id="guides" checked /> центр и bbox</label>
  <label id="refControl" hidden>эталон <input type="range" id="refOpacity" min="0" max="100" value="40" /></label>
</div>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  const sources = (params.get('src') || '').split(',').map((s) => s.trim()).filter(Boolean);
  const refSrc = params.get('ref');
  const bgMode = params.get('bg') || 'auto';
  const sizes = [16, 24, 32, 48, 96, 256];
  // auto: файл *-dark.svg предназначен для тёмной темы → тёмный фон; *-light.svg → светлый; иначе оба.
  const backgroundsFor = (src) => {
    if (bgMode === 'both') return ['dark', 'light'];
    if (bgMode !== 'auto') return [bgMode];
    if (/-dark\.svg$/i.test(src)) return ['dark'];
    if (/-light\.svg$/i.test(src)) return ['light'];
    return ['dark', 'light'];
  };
  const root = document.getElementById('root');

  if (!sources.length) root.textContent = 'Укажите ?src=/path/to/file.svg';
  if (refSrc) document.getElementById('refControl').hidden = false;

  const round = (n) => Math.round(n * 100) / 100;

  function analyze(svg) {
    const vb = svg.viewBox.baseVal;
    const box = svg.getBBox();
    const vbCx = vb.x + vb.width / 2, vbCy = vb.y + vb.height / 2;
    const bxCx = box.x + box.width / 2, bxCy = box.y + box.height / 2;
    return {
      vb, box,
      text: [
        `viewBox     ${round(vb.x)} ${round(vb.y)} ${round(vb.width)} × ${round(vb.height)}`,
        `bbox*       ${round(box.x)} ${round(box.y)} ${round(box.width)} × ${round(box.height)}`,
        `смещение центра  dx=${round(bxCx - vbCx)}  dy=${round(bxCy - vbCy)}`,
        `поля  слева=${round(box.x - vb.x)} справа=${round(vb.x + vb.width - box.x - box.width)} сверху=${round(box.y - vb.y)} снизу=${round(vb.y + vb.height - box.y - box.height)}`,
        `заполнение  ${round((box.width * box.height) / (vb.width * vb.height) * 100)}% площади viewBox`,
        `* bbox — геометрия без толщины stroke: у обводок видимый край шире на stroke-width/2`,
      ].join('\n'),
      overflow: box.x < vb.x - 0.01 || box.y < vb.y - 0.01 || box.x + box.width > vb.x + vb.width + 0.01 || box.y + box.height > vb.y + vb.height + 0.01,
    };
  }

  async function render(src) {
    const section = document.createElement('section');
    section.innerHTML = `<h2>${src}</h2>`;
    root.append(section);
    let markup;
    try {
      const res = await fetch(src);
      if (!res.ok) throw new Error(res.status);
      markup = await res.text();
    } catch (e) {
      section.insertAdjacentHTML('beforeend', `<p class="warn">Не удалось загрузить: ${e.message}</p>`);
      return;
    }
    const issues = [];
    if (/<script|\son\w+\s*=/i.test(markup)) issues.push('содержит script или on*-обработчики');
    if (/<image[\s>]/i.test(markup)) issues.push('содержит растровый <image>');
    if (/href\s*=\s*["']https?:/i.test(markup)) issues.push('внешние ссылки');
    if (!/viewBox=/.test(markup)) issues.push('нет viewBox');

    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:-9999px;width:256px;height:256px';
    probe.innerHTML = markup;
    document.body.append(probe);
    const probeSvg = probe.querySelector('svg');
    const info = analyze(probeSvg);
    probe.remove();
    if (info.overflow) issues.push('геометрия выходит за viewBox');

    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.textContent = info.text + (issues.length ? '\n\n⚠ ' + issues.join('\n⚠ ') : '');
    if (issues.length) stats.classList.add('warn');
    section.append(stats);

    for (const bg of backgroundsFor(src)) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.marginTop = '8px';
      for (const size of sizes) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const tile = document.createElement('div');
        tile.className = `tile tile--${bg}`;
        const frame = document.createElement('div');
        frame.className = 'frame';
        const ratio = info.vb.height / info.vb.width || 1;
        frame.style.width = size + 'px';
        frame.style.height = Math.round(size * ratio) + 'px';
        frame.innerHTML = markup.replace(/\sid="([^"]+)"/g, ` id="$1-${bg}-${size}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${bg}-${size})`).replace(/href="#([^"]+)"/g, `href="#$1-${bg}-${size}"`);
        if (size >= 96) {
          frame.classList.add('frame--guides');
          frame.insertAdjacentHTML('beforeend', '<div class="vb"></div>');
          const k = size / info.vb.width;
          const b = document.createElement('div');
          b.className = 'bbox';
          Object.assign(b.style, {
            left: (info.box.x - info.vb.x) * k + 'px', top: (info.box.y - info.vb.y) * k + 'px',
            width: info.box.width * k + 'px', height: info.box.height * k + 'px',
          });
          frame.append(b);
          if (refSrc) frame.insertAdjacentHTML('beforeend', `<img class="ref" src="${refSrc}" alt="">`);
        }
        tile.append(frame);
        cell.append(tile);
        cell.insertAdjacentHTML('beforeend', `<span class="label">${size}px · ${bg}</span>`);
        row.append(cell);
      }
      section.append(row);
    }
  }

  (async () => { for (const s of sources) await render(s); applyControls(); })();

  function applyControls() {
    document.body.classList.toggle('no-guides', !document.getElementById('guides').checked);
    const op = document.getElementById('refOpacity').value / 100;
    document.querySelectorAll('.ref').forEach((r) => (r.style.opacity = op));
  }
  document.getElementById('guides').addEventListener('change', applyControls);
  document.getElementById('refOpacity').addEventListener('input', applyControls);
</script>
</body>
</html>
